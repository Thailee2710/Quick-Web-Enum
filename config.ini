# Legacy sample configuration retained for users who still inspect config.ini.
# The modern CLI no longer requires this file. Prefer commands such as:
#   quick-web-enum ports -f input/ipNoPort.txt --ports 80,443,8080,8443
#   quick-web-enum paths -f output/domain.txt -w common.txt -o output/endpoints

[ports]
input_file = input/ipNoPort.txt
output_file = output/domain.txt
ports = 80,443,8080,8443
rate_note = Use external masscan/nmap for high-speed or deep service scans.

[paths]
input_file = output/domain.txt
wordlist = common.txt
output_dir = output/endpoints
statuses = 200,204,301,302,307,308,401,403

[resolve]
input_file = input/ipNoPort.txt
output_file = output/domain.txt
